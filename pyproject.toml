[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "like-git-sharepoint-wiki"
version = "0.1.0"
description = "Reviewed Markdown wiki layer for local folders and SharePoint adapters"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wiki-worker = "wiki_worker.cli:main"

[tool.setuptools.packages.find]
include = ["wiki_worker*"]

[tool.setuptools.package-data]
wiki_worker = ["static/*.html", "static/*.js"]
